name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  go:
    name: Go (format, vet, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Modules match go.sum
        run: go mod verify

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet ./...

      - name: Tests (race detector, coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Contract build (static linux binary)
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o server ./api
          file server | grep -q 'statically linked'

  vulns:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    name: Docker (lint, build, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        run: docker build -t shortened-api:ci .

      # Fake credentials are enough: presigning is local, and the smoke test
      # never lists or deletes, so the container never has to reach B2.
      # COOKIE_SECURE=false because curl talks plain HTTP to 127.0.0.1.
      - name: Start container
        run: |
          docker volume create shortened-data
          docker run -d --name api -p 8080:8080 \
            -v shortened-data:/data \
            -e B2_KEY_ID=0000000000000000000000001 \
            -e B2_APP_KEY=K0000000000000000000000000000000 \
            -e B2_ENDPOINT=https://s3.us-west-004.backblazeb2.com \
            -e B2_REGION=us-west-004 \
            -e B2_BUCKET=ci-bucket \
            -e COOKIE_SECURE=false \
            -e MAIL_LOG=true \
            shortened-api:ci

      - name: HEALTHCHECK reports healthy
        run: |
          for _ in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' api)"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "container health is '$status'"; docker logs api; exit 1

      - name: Runs as a non-root user
        run: test "$(docker inspect -f '{{.Config.User}}' api)" = app

      - name: HTTP smoke test
        run: |
          set -eu
          base=http://127.0.0.1:8080
          expect() { # expect <status> <curl args...>
            want="$1"; shift
            got="$(curl -s -o /tmp/body -w '%{http_code}' "$@")"
            if [ "$got" != "$want" ]; then
              echo "want $want, got $got for: $*"; cat /tmp/body; exit 1
            fi
          }

          jar=/tmp/cookies
          json='Content-Type: application/json'

          # Page and health
          expect 200 "$base/health"
          expect 200 "$base/"
          grep -q '<title>SHORTENED.</title>' /tmp/body || { echo "page not served"; exit 1; }
          curl -sI "$base/" | grep -qi '^content-security-policy:' || { echo "page has no CSP"; exit 1; }
          expect 200 "$base/app.js"
          expect 200 "$base/style.css"

          # Everything else needs a session
          expect 401 "$base/files"
          expect 401 "$base/auth/me"

          # Sign-up only stores a request and mails a code (MAIL_LOG=true writes
          # it to the log); the account exists once the code is entered.
          expect 202 -c "$jar" -H "$json" -d '{"username":"ci-user","password":"ci-password-123","email":"ci-user@example.test"}' "$base/auth/signup"
          expect 401 -H "$json" -d '{"username":"ci-user","password":"ci-password-123"}' "$base/auth/login"
          expect 200 -b "$jar" "$base/auth/signup/pending"
          code="$(docker logs api 2>&1 | grep -A6 'MAIL_LOG to=ci-user@example.test' | grep -oE '^    [0-9]{6}$' | tail -1 | tr -d ' ')"
          [ -n "$code" ] || { echo "no code in the log"; docker logs api; exit 1; }
          expect 201 -b "$jar" -c "$jar" -H "$json" -d "{\"code\":\"$code\"}" "$base/auth/signup/verify"
          grep -q 'HttpOnly' "$jar" || grep -q '#HttpOnly_' "$jar" || { echo "session cookie is not HttpOnly"; cat "$jar"; exit 1; }
          expect 200 -b "$jar" "$base/auth/me"
          grep -q '"username":"ci-user"' /tmp/body || { echo "wrong user"; cat /tmp/body; exit 1; }
          grep -q '"verified":true' /tmp/body || { echo "new account is not verified"; cat /tmp/body; exit 1; }
          expect 409 -H "$json" -d '{"username":"CI-USER","password":"another-password","email":"other@example.test"}' "$base/auth/signup"
          expect 401 -H "$json" -d '{"username":"ci-user","password":"wrong-password"}' "$base/auth/login"
          expect 403 -b "$jar" -H "$json" -H 'Origin: https://evil.example' -d '{"filename":"a","size":1}' "$base/upload-url"
          expect 200 -H "$json" -d '{"username":"ci-user@example.test","password":"ci-password-123"}' "$base/auth/login"
          expect 202 -H "$json" -d '{"login":"nobody"}' "$base/auth/forgot"

          # Signing, with the size bound into the upload URL
          expect 413 -b "$jar" -H "$json" -d '{"filename":"a.bin","size":52428801}' "$base/upload-url"
          expect 400 -b "$jar" "$base/download-url?key=..%2Fsecret"
          expect 404 -b "$jar" "$base/download-url?key=u%2F999%2F0123456789abcdef-theirs.txt"
          expect 400 -b "$jar" -H "$json" -d '{"filename":"photo (1).jpg","size":1}' "$base/upload-url"
          grep -q "'('" /tmp/body || { echo "bad-name message doesn't name the character"; cat /tmp/body; exit 1; }
          # The download checks the object in B2 before signing. With these fake
          # credentials B2 can't answer, so the page must get a clear 502, not a
          # link to nothing. (The attachment header is covered by TestDownloadURL.)
          expect 502 -b "$jar" "$base/download-url?key=u%2F1%2F0123456789abcdef-my..file.txt"
          grep -q 'could not reach storage' /tmp/body || { echo "unexpected download error"; cat /tmp/body; exit 1; }

          # Sign out ends the session
          expect 204 -b "$jar" -X POST "$base/auth/logout"
          expect 401 -b "$jar" "$base/auth/me"

          # Accounts survive a restart because they live on the volume
          docker restart api
          for _ in $(seq 1 20); do curl -sf "$base/health" >/dev/null && break; sleep 1; done
          expect 200 -c "$jar" -H "$json" -d '{"username":"ci-user","password":"ci-password-123"}' "$base/auth/login"

      - name: Stops gracefully on SIGTERM
        run: |
          docker stop -t 15 api
          docker logs api 2>&1 | grep -q 'shutting down'
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = 0

      - name: Container logs
        if: failure()
        run: docker logs api || true

  web:
    name: Web page (HTML, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: html-validate
        run: npx --yes html-validate@9.7.1 web/index.html

      - name: Script parses
        run: node --check web/app.js

      # The CSP forbids inline scripts, so an inline <script> would silently
      # not run in production.
      - name: No inline scripts or handlers
        run: |
          if grep -nE '<script>|<script [^>]*>[^<]|\son[a-z]+=' web/index.html; then
            echo "Inline scripts and on*= handlers are blocked by the page's CSP; put code in app.js."
            exit 1
          fi

      # File names come from users; building HTML from them would be XSS.
      - name: No HTML built from strings
        run: |
          if grep -nE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write' web/app.js; then
            echo "Use textContent and createElement instead."
            exit 1
          fi

      # The session cookie is HttpOnly; nothing should try to keep auth in storage.
      - name: No credentials in browser storage
        run: |
          if grep -nE 'localStorage|sessionStorage|document\.cookie' web/app.js; then
            echo "Auth lives in the HttpOnly session cookie only."
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No .env files committed
        run: |
          found="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)"
          if [ -n "$found" ]; then echo "Committed env files:"; echo "$found"; exit 1; fi
